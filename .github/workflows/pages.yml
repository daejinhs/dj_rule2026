name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true — 저장소에 Pages가 꺼져 있으면 여기서 켠다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 저장소 전체를 정적 사이트로 올린다 (.git, .github 은 액션이 알아서 제외).
      #   /            설문 앱 (기존)
      #   /slides/     학생생활규정 개정 교육 발표 뷰어
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
